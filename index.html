<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Регионы России</title>
<style>
:root{--sea:#cfe0e6;--oth:#dfe5e1;--nb:#8d9892;--tar:#a7d8c2;--ok:#2e9e5b;--bad:#d9453a;--hl:#fff;--halo:rgba(255,255,255,.85);
--glass:rgba(255,255,255,.88);--ink:#14231c;--mute:#5a6d64;--line:rgba(20,35,28,.14);--acc:#1f6f55;--warn:#d98a1a;
--ease:cubic-bezier(.22,.9,.28,1.05);--soft:cubic-bezier(.4,0,.2,1);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--sea:#0f1b22;--oth:#2b3a33;--nb:#0a0f0d;--tar:#2f6f58;--hl:#e8fff4;--halo:rgba(15,27,34,.88);
--glass:rgba(24,36,31,.88);--ink:#e8f2ed;--mute:#9bb0a6;--line:rgba(232,242,237,.14);--acc:#5fc4a0}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--sea);color:var(--ink);
font:17px/1.35 "Iowan Old Style","Palatino Linotype",Georgia,serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

#svg{position:fixed;inset:0;width:100%;height:100dvh;touch-action:none;user-select:none;background:var(--sea)}
#svg.fly{shape-rendering:optimizeSpeed}
path{stroke:var(--sea);stroke-width:.7;vector-effect:non-scaling-stroke;transition:fill .6s var(--soft),fill-opacity .6s ease;cursor:pointer}
path.n{fill:var(--nb);pointer-events:none}
path.o{fill:var(--oth)}
path.t{fill:var(--tar)}
body.hard path.t:not(.ok):not(.bad){fill:var(--oth)}
path.ask{fill:var(--warn);stroke:var(--hl);stroke-width:1.8}
path.ok,path.bad{stroke:var(--hl);stroke-width:1.8}
path.ok{fill:var(--ok);animation:flash .9s ease 2}
path.bad{fill:var(--bad)}
@keyframes flash{50%{fill-opacity:.45}}

#lbls{stroke-linejoin:round;pointer-events:none;transition:opacity .35s ease}
#svg.fly #lbls{opacity:0}
#lbls text{text-anchor:middle;dominant-baseline:central;font-weight:600;fill:var(--ink);stroke:var(--halo);paint-order:stroke;opacity:0;transition:opacity .35s ease}
#lbls text.on{opacity:1}
#tools button[aria-pressed="false"]{opacity:.5}

.toast,#tools,#label{touch-action:none}
.ov{touch-action:pan-y}
.prog{height:4px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .8s var(--soft)}

.toast{position:fixed;left:50%;width:min(92vw,470px);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
border:1px solid var(--line);border-radius:20px;padding:12px 16px;box-shadow:0 10px 34px rgba(0,0,0,.18);
opacity:0;pointer-events:none;transition:transform .7s var(--ease),opacity .45s ease;z-index:5;will-change:transform}
.toast.in{opacity:1;pointer-events:auto}
#top{top:calc(var(--sat) + 12px);transform:translate(-50%,-160%);display:flex;align-items:center;gap:14px}
#top.in{transform:translate(-50%,0)}
#bot,#quiz{bottom:calc(var(--sab) + 14px);transform:translate(-50%,170%)}
#bot.in,#quiz.in{transform:translate(-50%,0)}
#quiz{padding:10px}
.small{font-size:.85rem;color:var(--mute)}
.big{font-size:1.3rem;font-weight:bold;line-height:1.2}
#topTxt{flex:1;min-width:0}
.swap{animation:swap .5s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.skip{margin-top:8px;border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 12px;font-size:.8rem;color:var(--mute)}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:125.7;stroke-dashoffset:0;transition:stroke-dashoffset .12s linear,stroke .4s}
.ring.warn .fg{stroke:var(--warn)}
.ring.low .fg{stroke:var(--bad)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.05rem}
.ring.low b{color:var(--bad);animation:beat 1s ease infinite}
@keyframes beat{50%{transform:scale(1.18)}}
.res{display:flex;align-items:center;gap:12px}
.ico{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.3rem;font-weight:bold;background:var(--ok)}
.ico.bad{background:var(--bad)}
.ico.in{animation:pop .55s var(--ease)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.btn{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:bold;transition:transform .15s,opacity .3s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.chip{border:1px solid var(--line);background:transparent;padding:8px 14px;border-radius:99px;transition:background .25s,color .25s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:bold}
.hide{display:none!important}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:transparent;border-radius:14px;padding:10px 6px;min-height:56px;font-weight:600;font-size:.95rem;line-height:1.15;transition:background .3s,color .3s,transform .15s,opacity .3s}
.opt:active{transform:scale(.96)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.45}
.qres{margin:10px 4px 0;display:flex;align-items:center;gap:10px}
.qres:empty{display:none}
.qres .ico{width:34px;height:34px;font-size:1.05rem}
.qres b{display:block;line-height:1.15}
#qnext{margin-top:10px;padding:11px}

#label{position:fixed;left:0;top:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .5s ease;
background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);
border-radius:12px;padding:7px 12px;text-align:center;max-width:70vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#label.show{opacity:1}
#label b{display:block;font-size:.95rem;line-height:1.2}
#label span{font-size:.85rem;color:var(--mute)}
#label::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--glass);border:solid var(--line);border-width:0 1px 1px 0;transform:translateX(-50%) rotate(45deg)}

#tools{position:fixed;right:10px;top:50%;transform:translateY(-50%);display:grid;gap:8px;z-index:3}
#tools button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:1.25rem;line-height:1;transition:transform .15s}
#tools button:active{transform:scale(.92)}

.ov{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:16px;background:rgba(10,20,16,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
opacity:0;pointer-events:none;transition:opacity .5s ease}
.ov.show{opacity:1;pointer-events:auto}
#quit{z-index:9}
.card{width:min(100%,440px);max-height:90dvh;overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:22px 20px;
transform:translateY(24px) scale(.96);transition:transform .6s var(--ease)}
.ov.show .card{transform:none}
.card h1{font-size:1.7rem;margin:0 0 4px}
.card p{margin:0 0 10px;color:var(--mute)}
.lab{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
.mode{display:block;width:100%;text-align:left;border:1px solid var(--line);background:transparent;border-radius:14px;padding:10px 14px;margin-bottom:8px;font-weight:bold;transition:background .25s,transform .15s}
.mode:active{transform:scale(.98)}
.mode small{display:block;font-size:.8rem;font-weight:normal;opacity:.8;margin-top:2px}
.mode[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.score{font-size:3rem;font-weight:bold;line-height:1.1}
.card ul{padding-left:20px;margin:0 0 6px}
.card li{margin-bottom:5px}
.card a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>
</head>
<body>

<svg id="svg" preserveAspectRatio="xMidYMid meet"><g id="g"></g></svg>
<div id="label"></div>

<div class="toast" id="top">
  <div id="topTxt"><div class="small" id="topSmall"></div><div class="big" id="topName"></div><div class="prog" id="prog"><i id="progI"></i></div><button class="skip" id="skip">Не знаю</button></div>
  <div class="ring" id="ring"><svg viewBox="0 0 48 48"><circle class="bg" cx="24" cy="24" r="20"/><circle class="fg" id="fg" cx="24" cy="24" r="20"/></svg><b id="sec"></b></div>
</div>

<div class="toast" id="bot">
  <div class="res"><div class="ico" id="ico">✓</div><div><div class="big" id="resHead"></div><div class="small" id="resSub"></div></div></div>
  <button class="btn" id="next">Далее</button>
</div>

<div class="toast" id="quiz">
  <div class="opts" id="opts"></div>
  <div class="qres" id="qres"></div>
  <button class="btn hide" id="qnext">Далее</button>
</div>

<div id="tools">
  <button id="bMenu" aria-label="В меню">✕</button>
  <button id="bFull" aria-label="Во весь экран">⛶</button>
  <button id="bLbl" aria-label="Подписи регионов" aria-pressed="true">Аа</button>
  <button id="zi" aria-label="Приблизить">+</button>
  <button id="zo" aria-label="Отдалить">−</button>
  <button id="zh" aria-label="Вся карта">⌂</button>
</div>

<div class="ov show" id="menu">
  <div class="card">
    <h1>Регионы России</h1>
    <p>Тренажёр по субъектам РФ: карта и столицы.</p>
    <div class="lab">Режим</div>
    <div id="modes"></div>
    <button class="btn" id="bTest" style="margin-top:18px">Далее</button>
    <button class="btn alt hide" id="bWeak">Слабые места</button>
    <button class="btn alt" id="bStudy">Изучать карту</button>
    <p class="small" style="margin:12px 0 0">Границы: <a href="https://www.amcharts.com/svg-maps/">amCharts</a></p>
  </div>
</div>

<div class="ov" id="setup">
  <div class="card">
    <h1 id="setTitle"></h1>
    <p id="setDesc"></p>
    <div class="lab">Что учим</div>
    <div class="chips" id="chips"></div>
    <div id="hardBox"><div class="lab">Сложность</div><div class="chips"><button class="chip" id="hardChip" aria-pressed="false">Сложный режим: всё серое</button></div></div>
    <div class="lab">Сколько вопросов</div>
    <div class="chips" id="lens"></div>
    <button class="btn" id="bGo" style="margin-top:18px">Начать</button>
    <button class="btn alt" id="bBack">Назад</button>
  </div>
</div>


<div class="ov" id="quit">
  <div class="card">
    <h1>Завершить тест?</h1>
    <p>Прогресс не сохранится.</p>
    <button class="btn" id="qNo">Продолжить</button>
    <button class="btn alt" id="qYes">Завершить</button>
  </div>
</div>

<div class="ov" id="end">
  <div class="card">
    <h1>Результат</h1>
    <div class="score" id="final"></div>
    <p id="stats"></p>
    <p class="small hide" id="best"></p>
    <div id="wrongBox" class="hide">
      <div class="lab">Ошибки</div>
      <ul id="wrong"></ul>
    </div>
    <button class="btn hide" id="bRetry">Повторить ошибки</button>
    <button class="btn alt" id="again">В меню</button>
  </div>
</div>

  const h = w/asp;
  const bc = top + Bh/2;
  const cx = c[2] + c[4]/2 + (27/W)*w;
  const cy = c[3] + c[5]/2 + (H/2 - bc)*h/H;
  flyTo([cx-w/2, cy-h/2, w, h], ms || 1300);
}
function clamp(){
  const h = DATA.home, m = h[2]*.15, cx = vb[0]+vb[2]/2, cy = vb[1]+vb[3]/2;
  vb[0] += Math.min(h[0]+h[2]+m, Math.max(h[0]-m, cx)) - cx;
  vb[1] += Math.min(h[1]+h[3]+m, Math.max(h[1]-m, cy)) - cy;
}
function pt(px, py){ const p = svg.createSVGPoint(); p.x = px; p.y = py; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function zoom(f, cx, cy){
  stopFly();
  let [x,y,w,h] = vb;
  if (w/f > DATA.home[2]*1.3) f = w/(DATA.home[2]*1.3);
  if (w/f < DATA.home[2]/250) return;
  vb = [cx-(cx-x)/f, cy-(cy-y)/f, w/f, h/f]; clamp(); setVB();
}
const centerZoom = f => { const c = pt(innerWidth/2, innerHeight/2); zoom(f, c.x, c.y); };
$("zi").onclick = () => centerZoom(1.7);
$("zo").onclick = () => centerZoom(1/1.7);
$("zh").onclick = () => flyHome(1000);
$("bFull").onclick = () => { const d = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : (d.requestFullscreen && d.requestFullscreen().catch(()=>{})); };
svg.addEventListener("wheel", e => { e.preventDefault(); const c = pt(e.clientX, e.clientY); zoom(e.deltaY < 0 ? 1.25 : 0.8, c.x, c.y); }, {passive:false});

const ptr = new Map(); let moved = 0, dragged = false;
svg.addEventListener("pointerdown", e => { if (!ptr.size){ moved = 0; dragged = false; } ptr.set(e.pointerId, [e.clientX, e.clientY]); });
addEventListener("pointermove", e => {
  if (!ptr.has(e.pointerId)) return;
  const o = ptr.get(e.pointerId), nw = [e.clientX, e.clientY];
  const other = [...ptr].find(([k]) => k !== e.pointerId);
  moved += Math.hypot(nw[0]-o[0], nw[1]-o[1]);
  if (moved > 8) dragged = true;
  if (!other){
    if (dragged){ stopFly(); const a = svg.getScreenCTM().a; vb[0] -= (nw[0]-o[0])/a; vb[1] -= (nw[1]-o[1])/a; clamp(); setVB(); }
  } else {
    const q = other[1], d0 = Math.hypot(o[0]-q[0], o[1]-q[1]), d1 = Math.hypot(nw[0]-q[0], nw[1]-q[1]);
    if (d0 > 0){ const c = pt((nw[0]+q[0])/2, (nw[1]+q[1])/2); zoom(d1/d0, c.x, c.y); }
  }
  ptr.set(e.pointerId, nw);
});
["pointerup","pointercancel"].forEach(t => addEventListener(t, e => ptr.delete(e.pointerId)));
svg.addEventListener("click", e => {
  if (dragged) return;
  const p = e.target.closest("path");
  if (p && p.dataset.id) onPick(p.dataset.id);
});
$("bLbl").onclick = () => setLbl(!lblOn);

// ---------- запрет масштабирования самой страницы ----------
["gesturestart","gesturechange","gestureend"].forEach(n => document.addEventListener(n, e => e.preventDefault(), {passive:false}));
document.addEventListener("touchmove", e => { if (!e.target.closest(".card")) e.preventDefault(); }, {passive:false});
document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, {passive:false});

// ---------- подпись региона (только на карте и в изучении) ----------
let labelId = null;
function showLabel(id){
  labelId = id;
  const L = $("label");
  L.innerHTML = `<b>${nameOf(id)}</b>` + (S[id] ? `<span>${cwU(id)}: ${S[id][1]}</span>` : "");
  placeLabel(); L.classList.add("show"); updLabels(true);
}
function hideLabel(){ $("label").classList.remove("show"); labelId = null; updLabels(true); }
function placeLabel(){
  if (!labelId || !DATA.c[labelId]) return;
  const c = DATA.c[labelId], p = svg.createSVGPoint(); p.x = c[0]; p.y = c[1];
  const s = p.matrixTransform(svg.getScreenCTM());
  $("label").style.transform = `translate(${s.x}px,${s.y}px) translate(-50%,calc(-100% - 12px))`;
}

// ---------- игра ----------
let order = [], idx = 0, score = 0, miss = [], phase = "", mode = "", tStart = 0, timer = null, nextT = 0, autoT = 0;
let paused = false, pausedAt = 0, times = [], streak = 0, bestStreak = 0;
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.random()*(i+1)|0; [a[i],a[j]] = [a[j],a[i]]; } return a; };
const clearMarks = () => Object.values(paths).forEach(p => p.classList.remove("ok","bad","ask"));
const raise = id => { if (paths[id]) g.appendChild(paths[id]); };
const ov = (id, on) => $(id).classList.toggle("show", on);
const tin = (id, on) => $(id).classList.toggle("in", on);
const swap = () => { const t = $("topTxt"); t.classList.remove("swap"); void t.offsetWidth; t.classList.add("swap"); };

function pauseT(){
  if (phase === "ask" && !paused){ paused = true; clearInterval(timer); pausedAt = performance.now(); }
}
function resumeT(){
  if (paused){ paused = false; tStart += performance.now() - pausedAt; clearInterval(timer); timer = setInterval(tick, 100); }
}
function resetUI(){
  clearInterval(timer); clearTimeout(nextT); clearTimeout(autoT); phase = ""; paused = false;
  tin("top", false); tin("bot", false); tin("quiz", false); hideLabel(); clearMarks();
}
function startTest(list){
  resetUI(); mode = pick;
  let ids = shuffle(list || pool());
  if (!list && len) ids = ids.slice(0, len);
  order = ids; idx = 0; score = 0; miss = []; times = []; streak = 0; bestStreak = 0;
  document.body.classList.toggle("hard", hard && mode === "map");
  setLbl(mode === "map" ? !hard : false);
  ov("menu", false); $("ring").classList.remove("hide"); $("prog").classList.remove("hide"); $("progI").style.width = "0%"; flyHome(1000);
  setTimeout(ask, 600);
}
function startStudy(){
  resetUI(); mode = "study"; phase = "study";
  document.body.classList.remove("hard");
  setLbl(true);
  ov("menu", false); flyHome(1000);
  $("topSmall").textContent = "Режим изучения"; $("topName").textContent = "Нажми на любой регион";
  $("ring").classList.add("hide"); $("prog").classList.add("hide"); $("next").classList.add("hide"); $("skip").classList.add("hide");
  setTimeout(() => tin("top", true), 400);
}
function showOpts(tid){
  const others = shuffle(KEYS.filter(k => k !== tid));
  const same = others.filter(k => grpIdx(k) === grpIdx(tid)), rest = others.filter(k => grpIdx(k) !== grpIdx(tid));
  const opts = shuffle([tid, ...same.concat(rest).slice(0, 3)]);
  $("opts").innerHTML = opts.map(k => `<button class="opt" data-id="${k}">${mode === "cap" ? S[k][1] : S[k][0]}</button>`).join("");
  $("qres").innerHTML = ""; $("qnext").classList.add("hide"); $("qnext").disabled = false;
}
function ask(){
  LIMIT = mode === "map" ? 15 + (Math.random()*6|0) : 10 + (Math.random()*6|0);
  clearMarks(); hideLabel(); tin("bot", false); phase = "ask"; paused = false;
  const tid = order[idx], quiz = mode !== "map", first = !$("top").classList.contains("in");
  $("next").classList.remove("hide"); $("skip").classList.remove("hide");
  $("topSmall").textContent = `Вопрос ${idx+1} из ${order.length} · верно: ${score}` + (mode === "cap" ? " · выбери столицу" : mode === "rev" ? " · выбери регион" : "");
  $("topName").textContent = mode === "rev" ? S[tid][1] : nameOf(tid);
  $("progI").style.width = (idx/order.length*100) + "%";
  swap();
  if (quiz) showOpts(tid);
  if (mode === "cap"){ paths[tid].classList.add("ask"); raise(tid); focusRegion(tid, 1400); }
  setTimeout(() => {
    tin("top", true); if (quiz) tin("quiz", true);
    tStart = performance.now(); clearInterval(timer); timer = setInterval(tick, 100); tick();
  }, first ? 250 : 150);
}
function tick(){
  const left = Math.max(0, LIMIT - (performance.now()-tStart)/1000);
  $("sec").textContent = Math.ceil(left);
  $("fg").style.strokeDashoffset = 125.7 * (1 - left/LIMIT);
  $("ring").classList.toggle("warn", left <= 10 && left > 5);
  $("ring").classList.toggle("low", left <= 5);
  if (left <= 0) answer(null);
}
function onPick(id){
  if (mode === "study"){
    clearMarks(); paths[id].classList.add("bad"); raise(id);
    $("ico").className = "ico in"; $("ico").textContent = "i"; $("ico").style.background = "var(--acc)";
    $("resHead").textContent = nameOf(id);
    $("resSub").textContent = S[id] ? `${cwU(id)}: ${S[id][1]}` : "Не из списка (область или город)";
    tin("bot", true); focusRegion(id); showLabel(id);
    return;
  }
  if (mode === "map" && phase === "ask" && !paused) answer(id);
}
$("opts").onclick = e => {
  const b = e.target.closest(".opt");
  if (!b || phase !== "ask" || paused) return;
  answer(b.dataset.id);
};
$("skip").onclick = () => { if (phase === "ask" && !paused) answer(null, "skip"); };

function answer(id, why){
  phase = "done"; clearInterval(timer);
  const tid = order[idx], [name, cap] = S[tid], right = id === tid, quiz = mode !== "map";
  times.push(id ? Math.min(LIMIT, (performance.now()-tStart)/1000) : LIMIT);
  if (right){ score++; streak++; bestStreak = Math.max(bestStreak, streak); } else { miss.push(tid); streak = 0; }
  let w = getWeak(); if (right) w = w.filter(k => k !== tid); else if (!w.includes(tid)) w.push(tid); setWeak(w);
  paths[tid].classList.remove("ask"); paths[tid].classList.add("ok"); raise(tid);
  if (!right && id && mode === "map" && paths[id]){ paths[id].classList.add("bad"); raise(id); raise(tid); }
  const head = right ? "Верно!" : id ? (mode === "map" ? `Неверно — это ${nameOf(id)}` : "Неверно") : (why === "skip" ? "Пропущено" : "Время вышло");
  const sub = `${name} — ${cw(tid)}: ${cap}`;
  const last = idx === order.length-1;
  $("topSmall").textContent = `Вопрос ${idx+1} из ${order.length} · верно: ${score}`;
  $("progI").style.width = ((idx+1)/order.length*100) + "%";
  if (quiz){
    document.querySelectorAll("#opts .opt").forEach(b => {
      if (b.dataset.id === tid) b.classList.add("ok");
      else if (b.dataset.id === id) b.classList.add("bad");
      else b.classList.add("dim");
    });
    $("qres").innerHTML = `<div class="ico ${right ? "" : "bad"} in">${right ? "✓" : "✗"}</div><div><b>${head}</b><span class="small">${sub}</span></div>`;
    $("qnext").textContent = last ? "Показать результат" : "Далее";
    $("qnext").classList.remove("hide"); $("qnext").disabled = false;
    tin("quiz", true);
  } else {
    $("ico").style.background = "";
    $("ico").className = "ico in" + (right ? "" : " bad");
    $("ico").textContent = right ? "✓" : "✗";
    $("resHead").textContent = head; $("resSub").textContent = sub;
    $("next").textContent = last ? "Показать результат" : "Далее";
    $("next").disabled = false;
    tin("bot", true);
  }
  if (navigator.vibrate) navigator.vibrate(right ? 25 : [40,50,40]);
  focusRegion(tid, 1200);
  if (!quiz) showLabel(tid);
  // верный ответ в тестах со столицами листается сам
  if (quiz && right && !last) autoT = setTimeout(advance, 1700);
}
function advance(){
  if (phase !== "done") return;
  clearTimeout(autoT);
  phase = "wait"; $("next").disabled = true; $("qnext").disabled = true;
  tin("bot", false); tin("quiz", false); hideLabel();
  if (idx === order.length-1){ tin("top", false); setTimeout(finish, 700); return; }
  if (mode !== "cap") flyHome(1100);
  nextT = setTimeout(() => { idx++; ask(); }, mode === "map" ? 1700 : mode === "cap" ? 400 : 800);
}
$("next").onclick = advance;
$("qnext").onclick = advance;

function finish(){
  flyHome(1000); clearMarks();
  const pct = Math.round(score / order.length * 100);
  $("final").innerHTML = `${score} из ${order.length} <span style="font-size:1.5rem;color:var(--acc)">· ${pct}%</span>`;
  const avg = times.length ? (times.reduce((a,b) => a+b, 0) / times.length).toFixed(1) : "–";
  $("stats").textContent = `Среднее время ответа: ${avg} с · лучшая серия: ${bestStreak}`;
  $("wrongBox").classList.toggle("hide", !miss.length);
  $("bRetry").classList.toggle("hide", !miss.length);
  $("best").classList.add("hide");
  if (order.length === KEYS.length){
    try {
      const key = "karta_best_" + mode, old = +localStorage.getItem(key) || 0;
      if (score > old) localStorage.setItem(key, score);
      $("best").textContent = score > old ? "Новый рекорд!" : `Рекорд: ${old} из ${order.length}`;
      $("best").classList.remove("hide");
    } catch (e) {}
  }
  $("wrong").innerHTML = miss.map(id => `<li>${S[id][0]} — ${S[id][1]}</li>`).join("");
  ov("end", true);
}

// выход из теста с подтверждением
$("bMenu").onclick = () => {
  if (mode === "study" || !phase){ resetUI(); drawMenu(); ov("menu", true); return; }
  pauseT();
  ov("quit", true);
};
$("qNo").onclick = () => { ov("quit", false); resumeT(); };
$("qYes").onclick = () => { ov("quit", false); document.body.classList.remove("hard"); resetUI(); drawMenu(); ov("menu", true); };

// пауза, если вкладку свернули
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseT();
  else if (!$("quit").classList.contains("show")) resumeT();
});

$("again").onclick = () => { ov("end", false); document.body.classList.remove("hard"); drawMenu(); ov("menu", true); };
$("bTest").onclick = () => { drawMenu(); ov("menu", false); ov("setup", true); };
$("bBack").onclick = () => { ov("setup", false); ov("menu", true); };
$("bGo").onclick = () => { ov("setup", false); startTest(); };

$("bWeak").onclick = () => startTest(getWeak());
$("bRetry").onclick = () => { const m = miss.slice(); ov("end", false); startTest(m); };
$("bStudy").onclick = startStudy;

// меню и настройки
document.addEventListener("click", e => {
  if (!e.target.closest("#menu, #setup")) return;
  const m = e.target.closest(".mode"), c = e.target.closest(".chip");
  if (m) pick = m.dataset.m;
  else if (c){
    if (c.id === "hardChip") hard = !hard;
    else if (c.dataset.l !== undefined) len = +c.dataset.l;
    else if (c.dataset.k){
      const k = c.dataset.k;
      if (k === "all") sel = new Set(["all"]);
      else { sel.delete("all"); sel.has(k) ? sel.delete(k) : sel.add(k); if (!sel.size) sel = new Set(["all"]); }
    }
  } else return;
  save(); drawMenu();
});


load();
drawMenu();
build();
</script>
